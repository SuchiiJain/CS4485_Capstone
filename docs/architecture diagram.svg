  <text x="117" y="704" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">flagging.py</text>
  <text x="117" y="724" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">HIGH/MED/LOW severity</text>

