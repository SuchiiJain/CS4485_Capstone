  <text x="117" y="642" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">AST + fingerprints</text>

  <rect x="198" y="598" width="130" height="64" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
