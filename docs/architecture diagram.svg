<svg width="680" viewBox="0 0 680 860" role="img" xmlns="http://www.w3.org/2000/svg"
  style="font-family: system-ui, -apple-system, sans-serif; background: #ffffff;">

  <title>Documentation Rot Detector — Architecture Diagram</title>
  <desc>Full system architecture showing the React frontend, Firebase layer, Python backend pipeline, and external integrations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

