  <rect x="344" y="598" width="144" height="64" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="416" y="620" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">ai_suggestions.py</text>
  <text x="416" y="642" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Parallel LLM calls</text>

